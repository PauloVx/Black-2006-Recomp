name: Ambient occlusion regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ambient-occlusion:
    name: Ambient occlusion / Windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.1
          target: x86_64-pc-windows-msvc
      - name: Build production renderer, video and input libraries
        shell: pwsh
        run: |
          cmake -S third_party/xboxrecomp -B build-runtime -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Runtime configure failed' }
          cmake --build build-runtime --config Release --target xbox_nv2a xbox_video xbox_input
          if ($LASTEXITCODE -ne 0) { throw 'Renderer/video/input build failed' }
      - name: Build and run source-only regressions
        shell: pwsh
        run: |
          cmake -S tests/ambient_occlusion -B build-ambient-occlusion -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Test configure failed' }
          foreach ($configuration in 'Release', 'Debug') {
            cmake --build build-ambient-occlusion --config $configuration
            if ($LASTEXITCODE -ne 0) { throw "$configuration test build failed" }
            ctest --test-dir build-ambient-occlusion -C $configuration --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "$configuration regression failed" }
          }
      - name: Build and run shader manifest recovery regressions
        shell: pwsh
        run: |
          cmake -S tests/shader_manifest -B build-shader-manifest -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Shader manifest test configure failed' }
          foreach ($configuration in 'Release', 'Debug') {
            cmake --build build-shader-manifest --config $configuration
            if ($LASTEXITCODE -ne 0) { throw "$configuration shader manifest build failed" }
            ctest --test-dir build-shader-manifest -C $configuration --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "$configuration shader manifest regression failed" }
          }
      - name: Build and run native controls regressions
        shell: pwsh
        run: |
          cmake -S tests/controls -B build-controls -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Controls test configure failed' }
          foreach ($configuration in 'Release', 'Debug') {
            cmake --build build-controls --config $configuration
            if ($LASTEXITCODE -ne 0) { throw "$configuration controls build failed" }
            ctest --test-dir build-controls -C $configuration --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "$configuration controls regression failed" }
          }
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambient-occlusion-test-diagnostics
          path: |
            build-ambient-occlusion/Testing/Temporary/
            build-shader-manifest/Testing/Temporary/
            build-controls/Testing/Temporary/
          if-no-files-found: ignore
