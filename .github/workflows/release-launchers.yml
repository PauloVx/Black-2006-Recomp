name: Release launchers

on:
  pull_request:
    paths:
      - '*.sh'
      - '*.cmd'
      - '.gitattributes'
      - 'scripts/**'
      - 'cmake/**'
      - 'third_party/**'
      - '.gitmodules'
      - 'tests/linux_build/**'
      - 'launcher/**'
      - '.github/workflows/release-launchers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the launcher
        shell: pwsh
        run: ./scripts/build-launcher.ps1 -OutputDirectory build-release-launchers
      - name: Package and audit starter
        shell: pwsh
        run: |
          python scripts/release/test_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Release tests failed' }
          python scripts/release/build_release.py --version 0.1.0-alpha.4
          if ($LASTEXITCODE -ne 0) { throw 'Release packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: BLACK-starter
          path: releases/*
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shell, path, prefix and package regressions
        run: |
          bash -n ./*.sh scripts/linux/launch.sh
          python scripts/linux/test_launch.py
          python scripts/release/test_release.py
  linux-cross-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tools-18 llvm-18 lld-18 python3-venv cmake ninja-build build-essential wine64 \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libwayland-bin \
            wayland-protocols libxkbcommon-dev libvulkan1
      - name: Prepare pinned toolchain and build the native launcher
        run: bash scripts/setup-linux.sh --prepare-only
      - name: Compile and run production runtime and Rust ABI check under Wine
        run: bash scripts/linux/test_cross_build.sh
      - name: Package the Linux-built launcher
        run: python3 scripts/release/build_release.py --version 0.1.0-alpha.4
      - uses: actions/upload-artifact@v4
        with:
          name: BLACK-starter-built-on-Linux
          path: releases/*
