name: Launcher

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - 'scripts/check-launcher.py'
      - 'scripts/check-launcher-translations.py'
      - '.gitmodules'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - 'scripts/check-launcher.py'
      - 'scripts/check-launcher-translations.py'
      - '.gitmodules'
      - '.github/workflows/launcher.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Launcher / Windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build with warnings as errors
        working-directory: launcher
        run: |
          cmake --preset windows-ci
          cmake --build --preset windows-ci
      - name: Unit tests
        working-directory: launcher
        run: ctest --preset windows-ci

  linux:
    name: Launcher / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan1 libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev
          pip install clang-format==19.1.7 clang-tidy==19.1.0
      - name: Formatting
        run: python3 scripts/check-launcher.py
      - name: Translations
        run: python3 scripts/check-launcher-translations.py
      - name: Build with warnings as errors
        working-directory: launcher
        run: |
          cmake --preset linux-ci
          cmake --build --preset linux-ci
      - name: Unit tests
        working-directory: launcher
        run: ctest --preset linux-ci
      - name: clang-tidy
        run: python3 scripts/check-launcher.py --tidy build-launcher-linux-ci
