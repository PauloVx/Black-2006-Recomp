name: Movie skip regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  movie-skip:
    name: Movie skip / Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate localization catalogs and fresh language-bank setup
        shell: pwsh
        run: |
          python -m unittest discover -s tests/localization -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'Localization regressions failed' }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.1
          target: x86_64-pc-windows-msvc
      - name: Build production video and input libraries
        shell: pwsh
        run: |
          cmake -S third_party/xboxrecomp -B build-runtime -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Runtime configure failed' }
          cmake --build build-runtime --config Release --target xbox_video xbox_input
          if ($LASTEXITCODE -ne 0) { throw 'Video/input build failed' }
      - name: Build and run focused regressions
        shell: pwsh
        run: |
          cmake -S tests/movie_skip -B build-movie-skip -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Test configure failed' }
          foreach ($configuration in 'Release', 'Debug') {
            cmake --build build-movie-skip --config $configuration
            if ($LASTEXITCODE -ne 0) { throw "$configuration test build failed" }
            ctest --test-dir build-movie-skip -C $configuration --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "$configuration regression failed" }
          }
